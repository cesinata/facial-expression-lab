[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-expression-lab"
version = "0.1.0"
description = "Facial expression recognition: three studies with subject-wise evaluation and a browser demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
notebooks = ["jupytext", "nbstripout"]
landmarks = ["mediapipe>=0.10", "Pillow>=10"]
images = ["Pillow>=10"]
plots = ["matplotlib>=3.7"]
torch = ["torch>=2.2", "timm>=1.0", "onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E501", "E402", "I001", "F401"]
"notebooks/*.ipynb" = ["E501", "E402", "I001", "F401"]
"tests/*.py" = ["E501"]
